spring.application.name=hospitalerp

# ============================================================
# DEFAULT PROFILE: H2 In-Memory Database (for development)
# ============================================================
spring.datasource.url=jdbc:h2:mem:hospitalerp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# MYSQL PROFILE: Activate with --spring.profiles.active=mysql
# ============================================================
# Create MySQL database: CREATE DATABASE hospitalerp;
# ---
# spring.datasource.url=jdbc:mysql://localhost:3306/hospitalerp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.h2.console.enabled=false

server.port=8080
