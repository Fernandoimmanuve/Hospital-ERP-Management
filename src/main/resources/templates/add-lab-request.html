<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>Create Lab Request</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>



<body class="bg-light">


<div class="container mt-5">


<div class="card shadow">


<div class="card-header bg-success text-white">

<h3>
Create Patient Lab Request
</h3>

</div>



<div class="card-body">



<form th:action="@{/admin/lab-request/save}"
th:object="${labRequest}"
method="post">





<div class="row">


<div class="col-md-6 mb-3">

<label>Patient ID</label>

<input type="number"
class="form-control"
th:field="*{patientId}">

</div>



<div class="col-md-6 mb-3">

<label>Patient Name</label>

<input type="text"
class="form-control"
th:field="*{patientName}">

</div>


</div>







<div class="row">


<div class="col-md-6 mb-3">

<label>Doctor ID</label>

<input type="number"
class="form-control"
th:field="*{doctorId}">

</div>




<div class="col-md-6 mb-3">

<label>Doctor Name</label>

<input type="text"
class="form-control"
th:field="*{doctorName}">

</div>


</div>








<div class="mb-3">

<label>Laboratory Test</label>

<input type="text"
class="form-control"
th:field="*{testName}">

</div>







<div class="row">


<div class="col-md-6">

<label>Priority</label>


<select class="form-select"
th:field="*{priority}">


<option value="NORMAL">
NORMAL
</option>


<option value="URGENT">
URGENT
</option>


</select>


</div>





<div class="col-md-6">

<label>Status</label>


<select class="form-select"
th:field="*{status}">


<option value="Pending">
Pending
</option>


<option value="Processing">
Processing
</option>


<option value="Completed">
Completed
</option>


</select>


</div>



</div>







<div class="mt-3">

<label>Remarks</label>


<textarea class="form-control"
th:field="*{remarks}">
</textarea>


</div>







<br>


<button class="btn btn-success">

Save Request

</button>


<a th:href="@{/admin/lab-request}"
class="btn btn-secondary">

Back

</a>




</form>



</div>


</div>


</div>


</body>


</html>
