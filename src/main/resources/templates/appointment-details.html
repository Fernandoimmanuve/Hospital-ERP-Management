<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .card { border-radius: 15px; }
        .section-title { color: #0d6efd; font-weight: bold; }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>
                <i class="bi bi-clipboard-data me-1"></i> Appointment Details
            </h3>
        </div>

        <div class="card-body">

            <h5 class="section-title">
                <i class="bi bi-person me-1"></i> Patient Information
            </h5>

            <table class="table table-bordered">
                <tr>
                    <th>Patient Name</th>
                    <td th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}">Patient</td>
                </tr>
                <tr>
                    <th>Patient ID</th>
                    <td th:text="${appointment.patient.id}"></td>
                </tr>
                <tr>
                    <th>Phone</th>
                    <td th:text="${appointment.patient.phoneNumber}"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td th:text="${appointment.patient.email}"></td>
                </tr>
            </table>

            <h5 class="section-title mt-4">
                <i class="bi bi-calendar-event me-1"></i> Appointment Information
            </h5>

            <table class="table table-bordered">
                <tr>
                    <th>Date</th>
                    <td th:text="${appointment.appointmentDate}"></td>
                </tr>
                <tr>
                    <th>Time</th>
                    <td th:text="${appointment.appointmentTime}"></td>
                </tr>
                <tr>
                    <th>Reason</th>
                    <td th:text="${appointment.reason}"></td>
                </tr>
                <tr>
                    <th>Status</th>
                    <td>
                        <span class="badge bg-success" th:text="${appointment.status}"></span>
                    </td>
                </tr>
                <tr>
                    <th>Doctor</th>
                    <td th:text="${appointment.doctor.firstName + ' ' + appointment.doctor.lastName}"></td>
                </tr>
                <tr>
                    <th>Department</th>
                    <td th:text="${appointment.department.departmentName}"></td>
                </tr>
            </table>

            <h5 class="section-title mt-4">
                <i class="bi bi-pencil-square me-1"></i> Consultation Notes
            </h5>

            <textarea class="form-control" rows="5" placeholder="Enter diagnosis and consultation notes"></textarea>

            <div class="mt-4">
                <a th:href="@{/doctor/prescription/add/{id}(id=${appointment.patient.id})}" class="btn btn-success">
                    <i class="bi bi-prescription"></i> Write Prescription
                </a>
                <a th:href="@{/doctor/appointments}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
