<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>My Feedback</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow">



<div class="card-header bg-warning">



<div class="d-flex justify-content-between align-items-center">


<h3>

⭐ My Feedback Reviews

</h3>




<a th:href="@{/patient/feedback/add}"
class="btn btn-primary">


<i class="bi bi-plus-circle"></i>

Add Feedback


</a>



</div>


</div>









<div class="card-body">







<div th:if="${#lists.isEmpty(feedbackList)}"
class="alert alert-info">


No feedback submitted yet.


</div>









<div class="table-responsive">



<table class="table table-bordered table-hover">



<thead class="table-dark">


<tr>


<th>ID</th>

<th>Doctor</th>

<th>Service</th>

<th>Rating</th>

<th>Comments</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>









<tbody>



<tr th:each="feedback:${feedbackList}">





<td th:text="${feedback.id}">
</td>







<td>


<i class="bi bi-person-circle"></i>


<span th:text="${feedback.doctorName}">

Doctor

</span>


</td>







<td th:text="${feedback.serviceType}">
</td>







<td>


<span th:switch="${feedback.rating}">


<span th:case="5">

⭐⭐⭐⭐⭐

</span>


<span th:case="4">

⭐⭐⭐⭐

</span>


<span th:case="3">

⭐⭐⭐

</span>


<span th:case="2">

⭐⭐

</span>


<span th:case="1">

⭐

</span>


</span>


</td>







<td th:text="${feedback.comments}">
</td>







<td th:text="${feedback.createdAt}">
</td>







<td>


<span class="badge bg-success"
th:text="${feedback.status}">

ACTIVE

</span>


</td>







<td>



<a th:href="@{/patient/feedback/edit/{id}(id=${feedback.id})}"
class="btn btn-success btn-sm">


<i class="bi bi-pencil"></i>

Edit


</a>






<a th:href="@{/patient/feedback/delete/{id}(id=${feedback.id})}"
class="btn btn-danger btn-sm">


<i class="bi bi-trash"></i>

Delete


</a>



</td>







</tr>



</tbody>



</table>



</div>








<a th:href="@{/patient/dashboard}"
class="btn btn-secondary">


<i class="bi bi-house"></i>

Dashboard


</a>







</div>


</div>






</div>



</body>


</html>
