<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Doctors</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

            <h3>
                <i class="bi bi-person-vcard-fill"></i>
                Doctor Management
            </h3>

            <a th:href="@{/doctors/add}" class="btn btn-light">

                <i class="bi bi-plus-circle-fill"></i>

                Add Doctor

            </a>

        </div>

        <div class="card-body">

            <form class="row mb-3"
                  th:action="@{/doctors/search}"
                  method="get">

                <div class="col-md-10">

                    <input
                            type="text"
                            name="keyword"
                            class="form-control"
                            placeholder="Search Doctor">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-primary w-100">

                        Search

                    </button>

                </div>

            </form>

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Department</th>

                    <th>Specialization</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Status</th>

                    <th width="220">Action</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="doctor : ${doctors}">

                    <td th:text="${doctor.id}"></td>

                    <td>

                        <span th:text="${doctor.firstName}"></span>

                        <span th:text="${doctor.lastName}"></span>

                    </td>

                    <td th:text="${doctor.department}"></td>

                    <td th:text="${doctor.specialization}"></td>

                    <td th:text="${doctor.phoneNumber}"></td>

                    <td th:text="${doctor.email}"></td>

                    <td>

                        <span
                                th:if="${doctor.status=='ACTIVE'}"
                                class="badge bg-success">

                            ACTIVE

                        </span>

                        <span
                                th:if="${doctor.status!='ACTIVE'}"
                                class="badge bg-danger">

                            INACTIVE

                        </span>

                    </td>

                    <td>

                        <a
                                th:href="@{/doctors/view/{id}(id=${doctor.id})}"
                                class="btn btn-info btn-sm">

                            <i class="bi bi-eye-fill"></i>

                        </a>

                        <a
                                th:href="@{/doctors/edit/{id}(id=${doctor.id})}"
                                class="btn btn-warning btn-sm">

                            <i class="bi bi-pencil-fill"></i>

                        </a>

                        <a
                                th:href="@{/doctors/delete/{id}(id=${doctor.id})}"
                                class="btn btn-danger btn-sm"
                                onclick="return confirm('Delete this doctor?')">

                            <i class="bi bi-trash-fill"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
