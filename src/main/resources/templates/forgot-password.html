<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital ERP | Forgot Password</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>
<div class="login-page">
    <div class="login-bg"></div>
    <div class="login-bg-overlay"></div>

    <!-- Floating Medical Icons -->
    <div class="floating-icons">
        <i class="fas fa-heartbeat float-icon float-icon-1"></i>
        <i class="fas fa-stethoscope float-icon float-icon-2"></i>
        <i class="fas fa-pills float-icon float-icon-3"></i>
        <i class="fas fa-syringe float-icon float-icon-4"></i>
        <i class="fas fa-ambulance float-icon float-icon-5"></i>
        <i class="fas fa-notes-medical float-icon float-icon-6"></i>
    </div>

    <div class="login-panel-wrapper">
        <div class="login-panel">
            <!-- Lock Icon -->
            <div class="login-avatar stagger-item">
                <i class="fas fa-key"></i>
            </div>

            <!-- Title -->
            <h1 class="login-title stagger-item">Forgot Password</h1>
            <p class="login-subtitle stagger-item">Enter your email to receive a reset link</p>

            <!-- Error -->
            <div th:if="${error}" class="login-alert alert-danger stagger-item">
                <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
            </div>

            <!-- Forgot Password Form -->
            <form class="login-form" id="forgotPasswordForm" th:action="@{/forgot-password}" method="post">
                <!-- Email Field -->
                <div class="form-group stagger-item">
                    <label for="forgotEmail">Email Address</label>
                    <div class="input-group-glass">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="forgotEmail" name="email" class="form-control-glass"
                               placeholder="Enter your registered email" required autocomplete="email">
                    </div>
                    <div class="invalid-feedback"></div>
                </div>

                <!-- Action Buttons -->
                <div class="login-actions stagger-item">
                    <button type="submit" class="btn-login-primary" id="resetBtn">
                        <span class="btn-text"><i class="fas fa-paper-plane"></i> Send Reset Link</span>
                        <span class="btn-loading d-none">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Sending...
                        </span>
                    </button>
                </div>
            </form>

            <!-- Back to Login -->
            <div class="login-footer stagger-item">
                <p><a th:href="@{/login}" class="register-link"><i class="fas fa-arrow-left me-1"></i> Back to Sign In</a></p>
                <span class="copyright"><i class="far fa-copyright me-1"></i> 2026 Hospital ERP Management System</span>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
