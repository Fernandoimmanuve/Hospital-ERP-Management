<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department Management | Hospital ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3>
                    <i class="bi bi-building-fill"></i>
                    Department Management
                </h3>

                <a th:href="@{/admin/departments/add}" class="btn btn-light">

                    <i class="bi bi-plus-circle-fill"></i>

                    Add Department

                </a>

            </div>

        </div>

        <div class="card-body">

            <!-- Search -->

            <form th:action="@{/admin/departments/search}"
                  method="get"
                  class="row mb-4">

                <div class="col-md-10">

                    <input
                            type="text"
                            name="keyword"
                            class="form-control"
                            placeholder="Search department by name...">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-primary w-100">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </form>

            <!-- Department Table -->

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Department</th>

                        <th>Code</th>

                        <th>Head</th>

                        <th>Location</th>

                        <th>Contact</th>

                        <th>Status</th>

                        <th width="180">Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="department : ${departments}">

                        <td th:text="${department.id}"></td>

                        <td th:text="${department.departmentName}"></td>

                        <td th:text="${department.departmentCode}"></td>

                        <td th:text="${department.headOfDepartment}"></td>

                        <td th:text="${department.location}"></td>

                        <td th:text="${department.contactNumber}"></td>

                        <td>

                            <span
                                    class="badge"
                                    th:classappend="${department.status == 'Active'} ?
                                    'bg-success' : 'bg-danger'"
                                    th:text="${department.status}">
                            </span>

                        </td>

                        <td>

                            <a
                                    th:href="@{/admin/departments/edit/{id}(id=${department.id})}"
                                    class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square"></i>

                                Edit

                            </a>

                            <a
                                    th:href="@{/admin/departments/delete/{id}(id=${department.id})}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('Delete this department?');">

                                <i class="bi bi-trash-fill"></i>

                                Delete

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(departments)}">

                        <td colspan="8" class="text-center text-muted">

                            No departments found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="mt-3">

                <a th:href="@{/admin/dashboard}" class="btn btn-secondary">

                    <i class="bi bi-arrow-left-circle"></i>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
