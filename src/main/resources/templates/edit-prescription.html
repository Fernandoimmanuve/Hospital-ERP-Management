<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Edit Prescription</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow">



<div class="card-header bg-warning">


<h3>

✏️ Edit Prescription

</h3>


</div>







<div class="card-body">





<form th:action="@{/doctor/prescription/update}"
th:object="${prescription}"
method="post">





<input type="hidden"
th:field="*{id}">



<input type="hidden"
th:field="*{doctorId}">



<input type="hidden"
th:field="*{patientId}">







<div class="row">






<div class="col-md-6 mb-3">


<label class="form-label">

Doctor Name

</label>


<input type="text"
class="form-control"
th:field="*{doctorName}"
readonly>


</div>








<div class="col-md-6 mb-3">


<label class="form-label">

Patient Name

</label>


<input type="text"
class="form-control"
th:field="*{patientName}"
readonly>


</div>






</div>









<div class="mb-3">


<label class="form-label">

Diagnosis

</label>


<textarea class="form-control"
rows="3"
th:field="*{diagnosis}">

</textarea>


</div>









<div class="mb-3">


<label class="form-label">

Medicines 💊

</label>


<textarea class="form-control"
rows="5"
th:field="*{medicines}">

</textarea>


</div>









<div class="mb-3">


<label class="form-label">

Dosage Instructions

</label>


<textarea class="form-control"
rows="3"
th:field="*{dosageInstructions}">

</textarea>


</div>









<div class="mb-3">


<label class="form-label">

Duration

</label>


<input type="text"
class="form-control"
th:field="*{duration}">


</div>









<div class="mb-3">


<label class="form-label">

Status

</label>


<select class="form-select"
th:field="*{status}">


<option value="ACTIVE">

ACTIVE

</option>


<option value="COMPLETED">

COMPLETED

</option>


<option value="EXPIRED">

EXPIRED

</option>


</select>


</div>









<button type="submit"
class="btn btn-success">


<i class="bi bi-save"></i>

Update Prescription


</button>







<a th:href="@{/doctor/prescription/history}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Back


</a>







</form>





</div>


</div>






</div>



</body>


</html>
