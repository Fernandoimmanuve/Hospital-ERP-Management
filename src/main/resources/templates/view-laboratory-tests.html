<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>Laboratory Tests</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>


<body class="bg-light">


<div class="container-fluid mt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">


<div class="d-flex justify-content-between align-items-center">


<h3>

<i class="bi bi-heart-pulse-fill"></i>

Laboratory Test Management

</h3>



<a th:href="@{/admin/laboratory-tests/add}"
class="btn btn-light">


<i class="bi bi-plus-circle"></i>

Add Test

</a>



</div>


</div>





<div class="card-body">



<!-- Search -->

<form th:action="@{/admin/laboratory-tests/search}"
method="get"
class="row mb-3">


<div class="col-md-10">


<input type="text"
name="keyword"
class="form-control"
placeholder="Search laboratory test">


</div>



<div class="col-md-2">


<button class="btn btn-primary w-100">

<i class="bi bi-search"></i>

Search

</button>


</div>


</form>







<table class="table table-bordered table-hover">


<thead class="table-dark">


<tr>

<th>ID</th>

<th>Test Name</th>

<th>Category</th>

<th>Price</th>

<th>Normal Range</th>

<th>Status</th>

<th>Action</th>

</tr>


</thead>





<tbody>


<tr th:each="test:${tests}">


<td th:text="${test.id}"></td>


<td th:text="${test.testName}"></td>


<td th:text="${test.category}"></td>


<td>
₹ <span th:text="${test.price}"></span>
</td>


<td th:text="${test.normalRange}"></td>



<td>


<span class="badge bg-success"
th:if="${test.status=='Active'}">

Active

</span>


<span class="badge bg-danger"
th:if="${test.status=='Inactive'}">

Inactive

</span>


</td>





<td>


<a th:href="@{/admin/laboratory-tests/edit/{id}(id=${test.id})}"
class="btn btn-warning btn-sm">


<i class="bi bi-pencil"></i>

</a>




<a th:href="@{/admin/laboratory-tests/delete/{id}(id=${test.id})}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this test?')">


<i class="bi bi-trash"></i>

</a>



</td>


</tr>



</tbody>


</table>



<a th:href="@{/admin/laboratory-tests/dashboard}"
class="btn btn-dark">


<i class="bi bi-bar-chart"></i>

Dashboard

</a>



</div>


</div>


</div>


</body>


</html>
