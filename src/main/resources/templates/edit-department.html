<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Department | Hospital ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>
                <i class="bi bi-pencil-square"></i>
                Edit Department
            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/departments/update}"
                  th:object="${department}"
                  method="post">

                <!-- Hidden ID -->
                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Department Name</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{departmentName}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Department Code</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{departmentCode}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Head of Department</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{headOfDepartment}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Contact Number</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{contactNumber}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Location</label>

                        <input
                                type="text"
                                class="form-control"
                                th:field="*{location}"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Status</label>

                        <select
                                class="form-select"
                                th:field="*{status}">

                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>

                        </select>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label class="form-label">Description</label>

                        <textarea
                                class="form-control"
                                rows="4"
                                th:field="*{description}">
                        </textarea>

                    </div>

                </div>

                <button type="submit" class="btn btn-success">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Department

                </button>

                <a th:href="@{/admin/departments}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
