<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin-layout-fragment :: head('Billing Management - MediCore ERP', ~{:: style})}">
    <title>Billing Management - Hospital ERP</title>
    <style>
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-badge.paid {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
        }
        .status-badge.pending {
            background: rgba(245, 158, 11, 0.12);
            color: #f59e0b;
        }
        .status-badge.overdue {
            background: rgba(244, 63, 94, 0.12);
            color: #f43f5e;
        }
    </style>
</head>
<body th:replace="~{admin-layout-fragment :: body(~{:: #admin-billing-content})}">

<div id="admin-billing-content">
    <div class="d-flex align-items-center justify-content-between mb-4 animate-fade-in">
        <div>
            <h2 class="fw-bold m-0">Billing Management</h2>
            <p class="text-muted small m-0">
                <i class="bi bi-receipt me-1"></i> Manage all patient bills and payments
            </p>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
        <div class="col-xl-4 col-sm-4">
            <div class="card metric-card card-doctors p-3">
                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 text-uppercase tracking-wider small fw-semibold">Total Bills</p>
                        <h2 class="fw-bold m-0 font-mono" th:text="${totalBills != null ? totalBills : '0'}">0</h2>
                    </div>
                    <div class="icon-box bg-primary bg-opacity-10 text-primary">
                        <i class="bi bi-receipt"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-4 col-sm-4">
            <div class="card metric-card card-patients p-3">
                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 text-uppercase tracking-wider small fw-semibold">Paid</p>
                        <h2 class="fw-bold m-0 font-mono" th:text="${paidBills != null ? paidBills : '0'}">0</h2>
                    </div>
                    <div class="icon-box bg-success bg-opacity-10 text-success">
                        <i class="bi bi-check-circle"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-4 col-sm-4">
            <div class="card metric-card card-appointments p-3">
                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 text-uppercase tracking-wider small fw-semibold">Pending</p>
                        <h2 class="fw-bold m-0 font-mono" th:text="${pendingBills != null ? pendingBills : '0'}">0</h2>
                    </div>
                    <div class="icon-box bg-warning bg-opacity-10 text-warning">
                        <i class="bi bi-clock"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bills Table -->
    <div class="glass-panel p-4 animate-fade-in-up delay-3">
        <h5 class="fw-semibold mb-3">
            <i class="bi bi-list-ul me-2 text-primary"></i>All Bills
        </h5>
        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Bill ID</th>
                        <th>Patient ID</th>
                        <th>Amount</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Due Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="bill : ${bills}" th:if="${not #lists.isEmpty(bills)}">
                        <td><span class="font-mono" th:text="${bill.id}">1</span></td>
                        <td th:text="${bill.patientId}">1</td>
                        <td class="font-mono" th:text="${'$' + #numbers.formatDecimal(bill.amount, 1, 2)}">$0.00</td>
                        <td><span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1" th:text="${bill.billType}">General</span></td>
                        <td class="text-muted" th:text="${bill.billDate}">2026-07-22</td>
                        <td class="text-muted" th:text="${bill.dueDate}">2026-08-22</td>
                        <td>
                            <span class="status-badge paid" th:if="${bill.paymentStatus == 'Paid'}" th:text="${bill.paymentStatus}">Paid</span>
                            <span class="status-badge pending" th:if="${bill.paymentStatus == 'Pending'}" th:text="${bill.paymentStatus}">Pending</span>
                            <span class="status-badge overdue" th:if="${bill.paymentStatus == 'Overdue'}" th:text="${bill.paymentStatus}">Overdue</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/billing/view/{id}(id=${bill.id})}" class="btn btn-sm btn-outline-light border-opacity-10 rounded-pill px-3">
                                <i class="bi bi-eye me-1"></i> View
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(bills)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No bills found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
