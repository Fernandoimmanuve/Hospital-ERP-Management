<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Patient Lab Requests</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>


<body class="bg-light">


<div class="container-fluid mt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">


<div class="d-flex justify-content-between">


<h3>
🧪 Patient Laboratory Requests
</h3>



<a th:href="@{/admin/lab-request/add}"
class="btn btn-light">

<i class="bi bi-plus-circle"></i>

Create Request

</a>


</div>


</div>





<div class="card-body">



<!-- Search -->

<form th:action="@{/admin/lab-request/search}"
method="get"
class="row mb-3">


<div class="col-md-10">

<input type="text"
name="keyword"
class="form-control"
placeholder="Search Patient Name">

</div>



<div class="col-md-2">

<button class="btn btn-primary w-100">

Search

</button>

</div>


</form>







<table class="table table-bordered table-hover">


<thead class="table-dark">


<tr>

<th>ID</th>

<th>Patient</th>

<th>Doctor</th>

<th>Test</th>

<th>Date</th>

<th>Priority</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>





<tbody>


<tr th:each="request:${requests}">


<td th:text="${request.id}"></td>


<td th:text="${request.patientName}"></td>


<td th:text="${request.doctorName}"></td>


<td th:text="${request.testName}"></td>


<td th:text="${request.requestDate}"></td>





<td>


<span class="badge bg-danger"
th:if="${request.priority=='URGENT'}">

URGENT

</span>


<span class="badge bg-success"
th:if="${request.priority=='NORMAL'}">

NORMAL

</span>


</td>







<td>


<span class="badge bg-warning text-dark"
th:if="${request.status=='Pending'}">

Pending

</span>


<span class="badge bg-info"
th:if="${request.status=='Processing'}">

Processing

</span>


<span class="badge bg-success"
th:if="${request.status=='Completed'}">

Completed

</span>


</td>







<td>


<a th:href="@{/admin/lab-request/edit/{id}(id=${request.id})}"
class="btn btn-warning btn-sm">

<i class="bi bi-pencil"></i>

</a>





<a th:href="@{/admin/lab-request/delete/{id}(id=${request.id})}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete request?')">


<i class="bi bi-trash"></i>

</a>



</td>


</tr>


</tbody>


</table>






<a th:href="@{/admin/lab-request/dashboard}"
class="btn btn-dark">


<i class="bi bi-bar-chart"></i>

Dashboard


</a>



</div>


</div>


</div>


</body>


</html>
