<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Lab Result Dashboard</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>



<body class="bg-light">


<div class="container-fluid mt-4">


<div class="card shadow">


<div class="card-header bg-primary text-white">


<h3>

📄 Laboratory Result Dashboard

</h3>


</div>







<div class="card-body">



<div class="row g-4">





<!-- Total Results -->


<div class="col-md-3">


<div class="card shadow text-center p-4">


<i class="bi bi-file-earmark-medical fs-1 text-primary"></i>


<h5 class="mt-3">

Total Results

</h5>


<h1 th:text="${totalResults}">

0

</h1>


</div>


</div>








<!-- Pending -->


<div class="col-md-3">


<div class="card shadow text-center p-4">


<i class="bi bi-hourglass-split fs-1 text-warning"></i>


<h5 class="mt-3">

Pending Verification

</h5>


<h1 th:text="${pendingResults}">

0

</h1>


</div>


</div>








<!-- Completed -->


<div class="col-md-3">


<div class="card shadow text-center p-4">


<i class="bi bi-check-circle fs-1 text-success"></i>


<h5 class="mt-3">

Completed Reports

</h5>


<h1 th:text="${completedResults}">

0

</h1>


</div>


</div>








<!-- Approved -->


<div class="col-md-3">


<div class="card shadow text-center p-4">


<i class="bi bi-person-check fs-1 text-info"></i>


<h5 class="mt-3">

Approved Reports

</h5>


<h1 th:text="${verifiedResults}">

0

</h1>


</div>


</div>



</div>









<hr class="my-4">







<div class="d-flex gap-3">


<a th:href="@{/admin/lab-result}"
class="btn btn-primary">


<i class="bi bi-list"></i>

View Results


</a>







<a th:href="@{/admin/lab-result/verification}"
class="btn btn-success">


<i class="bi bi-shield-check"></i>

Verification Queue


</a>







<a th:href="@{/admin/lab-result/add}"
class="btn btn-warning">


<i class="bi bi-plus-circle"></i>

Add Result


</a>



</div>







</div>


</div>


</div>



</body>


</html>
