<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<title>Add Prescription Verification</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">


</head>



<body class="bg-light">


<div class="container mt-5">


<div class="card shadow">


<div class="card-header bg-primary text-white">

<h3>
💊 Prescription Verification
</h3>

</div>




<div class="card-body">



<form th:action="@{/admin/pharmacy/prescription/save}"
      th:object="${prescription}"
      method="post">



<div class="row">



<div class="col-md-6 mb-3">

<label>
Prescription ID
</label>


<input type="number"
       class="form-control"
       th:field="*{prescriptionId}"
       required>

</div>





<div class="col-md-6 mb-3">

<label>
Patient Name
</label>


<input type="text"
       class="form-control"
       th:field="*{patientName}"
       required>

</div>






<div class="col-md-6 mb-3">

<label>
Doctor Name
</label>


<input type="text"
       class="form-control"
       th:field="*{doctorName}"
       required>


</div>







<div class="col-md-6 mb-3">

<label>
Medicine Name
</label>


<input type="text"
       class="form-control"
       th:field="*{medicineName}"
       required>


</div>








<div class="col-md-6 mb-3">

<label>
Quantity
</label>


<input type="number"
       class="form-control"
       th:field="*{quantity}"
       required>


</div>







<div class="col-md-6 mb-3">

<label>
Pharmacist Name
</label>


<input type="text"
       class="form-control"
       th:field="*{pharmacistName}"
       required>


</div>






<div class="col-md-12 mb-3">


<label>
Remarks
</label>


<textarea class="form-control"
          th:field="*{remarks}">
</textarea>


</div>



</div>





<button class="btn btn-success">

Save Verification

</button>



<a th:href="@{/admin/pharmacy/prescription}"
   class="btn btn-secondary">

Back

</a>




</form>



</div>


</div>


</div>



</body>

</html>
