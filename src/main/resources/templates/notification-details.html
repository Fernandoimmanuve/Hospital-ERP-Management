<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Notification Details</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<style>

.notification-card{

    border-radius:15px;

}


.section-header{

    background:#0d6efd;
    color:white;
    padding:10px;
    border-radius:5px;

}

</style>


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow notification-card">



<div class="card-header bg-primary text-white">


<h3>

🔔 Notification Details

</h3>


</div>







<div class="card-body">








<h5 class="section-header">

📢 Notification Information

</h5>







<table class="table table-bordered">


<tr>

<th>Title</th>

<td th:text="${notification.title}"></td>

</tr>



<tr>

<th>Type</th>

<td th:text="${notification.type}"></td>

</tr>



<tr>

<th>Status</th>

<td th:text="${notification.status}"></td>

</tr>



<tr>

<th>Date & Time</th>

<td th:text="${notification.createdAt}"></td>

</tr>


</table>









<h5 class="section-header mt-4">

📝 Message

</h5>





<div class="alert alert-info">


<p th:text="${notification.message}">

Notification Message

</p>


</div>









<div class="mt-3">



<a th:if="${notification.status=='UNREAD'}"
th:href="@{/patient/notifications/read/{id}(id=${notification.id})}"
class="btn btn-success">


<i class="bi bi-check-circle"></i>

Mark As Read


</a>






<a th:href="@{/patient/notifications}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Back


</a>




</div>






</div>


</div>







</div>



</body>


</html>
