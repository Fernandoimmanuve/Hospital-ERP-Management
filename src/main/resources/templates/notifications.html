<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Patient Notifications</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow">



<div class="card-header bg-primary text-white">


<div class="d-flex justify-content-between align-items-center">


<h3>

🔔 My Notifications

</h3>




<span class="badge bg-danger fs-6">

Unread:

<span th:text="${unreadCount}">
0
</span>

</span>



</div>


</div>








<div class="card-body">






<div th:if="${#lists.isEmpty(notifications)}"
class="alert alert-info">


No notifications available.


</div>









<div class="list-group">





<div th:each="notification:${notifications}"
class="list-group-item mb-2 shadow-sm">







<div class="d-flex justify-content-between">





<div>



<h5>


<span th:switch="${notification.type}">


<i th:case="'APPOINTMENT'"
class="bi bi-calendar-check text-primary">
</i>



<i th:case="'PRESCRIPTION'"
class="bi bi-prescription text-success">
</i>



<i th:case="'LAB'"
class="bi bi-file-medical text-danger">
</i>



<i th:case="'PAYMENT'"
class="bi bi-credit-card text-warning">
</i>



<i th:case="*"
class="bi bi-bell text-secondary">
</i>



</span>




<span th:text="${notification.title}">

Notification Title

</span>


</h5>





<p class="mb-1"
th:text="${notification.message}">

Message

</p>






<small class="text-muted">


<i class="bi bi-clock"></i>


<span th:text="${notification.createdAt}">

Date

</span>


</small>



</div>









<div>





<span class="badge bg-success"
th:if="${notification.status=='READ'}">


Read


</span>






<span class="badge bg-warning text-dark"
th:if="${notification.status=='UNREAD'}">


Unread


</span>







<br><br>






<a th:href="@{/patient/notifications/read/{id}(id=${notification.id})}"
class="btn btn-success btn-sm"
th:if="${notification.status=='UNREAD'}">


<i class="bi bi-check"></i>

Read


</a>






<a th:href="@{/patient/notifications/view/{id}(id=${notification.id})}"
class="btn btn-primary btn-sm">


<i class="bi bi-eye"></i>

View


</a>






<a th:href="@{/patient/notifications/delete/{id}(id=${notification.id})}"
class="btn btn-danger btn-sm">


<i class="bi bi-trash"></i>

Delete


</a>





</div>






</div>







</div>





</div>









<a th:href="@{/patient/dashboard}"
class="btn btn-secondary mt-3">


<i class="bi bi-arrow-left"></i>

Dashboard


</a>







</div>


</div>






</div>



</body>


</html>
