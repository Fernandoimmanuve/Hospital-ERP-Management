<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>
                <i class="bi bi-pencil-square me-1"></i> Edit Doctor Profile
            </h3>
        </div>

        <div class="card-body">

            <form th:action="@{/doctor/profile/update}" th:object="${doctor}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" th:field="*{firstName}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" th:field="*{lastName}" required>
                    </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Specialization</label>
                        <input type="text" class="form-control" th:field="*{specialization}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" th:field="*{department}">
                    </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Qualification</label>
                        <input type="text" class="form-control" th:field="*{qualification}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Experience (Years)</label>
                        <input type="number" class="form-control" th:field="*{experience}">
                    </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">License Number</label>
                        <input type="text" class="form-control" th:field="*{licenseNumber}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Consultation Fee</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{consultationFee}">
                    </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}">
                    </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-save"></i> Save Changes
                </button>

                <a th:href="@{/doctor/profile}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancel
                </a>

            </form>

        </div>

</div>

</body>
</html>
