<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>Add Lab Result</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


<div class="card shadow">


<div class="card-header bg-success text-white">

<h3>
📄 Enter Laboratory Result
</h3>

</div>



<div class="card-body">


<form th:action="@{/admin/lab-result/save}"
th:object="${labResult}"
method="post">





<div class="row">


<div class="col-md-6 mb-3">

<label>Sample Code</label>

<input type="text"
class="form-control"
th:field="*{sampleCode}">

</div>



<div class="col-md-6 mb-3">

<label>Patient Name</label>

<input type="text"
class="form-control"
th:field="*{patientName}">

</div>


</div>








<div class="mb-3">

<label>Test Name</label>

<input type="text"
class="form-control"
th:field="*{testName}">

</div>







<div class="mb-3">

<label>Result Value</label>

<textarea class="form-control"
rows="4"
th:field="*{resultValue}">

</textarea>

</div>







<div class="row">


<div class="col-md-6">

<label>Normal Range</label>

<input type="text"
class="form-control"
th:field="*{normalRange}">

</div>




<div class="col-md-6">

<label>Unit</label>

<input type="text"
class="form-control"
th:field="*{resultUnit}">

</div>


</div>







<div class="mb-3 mt-3">

<label>Remarks</label>

<textarea class="form-control"
th:field="*{remarks}">
</textarea>

</div>







<button class="btn btn-success">

Save Result

</button>



<a th:href="@{/admin/lab-result}"
class="btn btn-secondary">

Back

</a>



</form>


</div>


</div>


</div>


</body>


</html>
