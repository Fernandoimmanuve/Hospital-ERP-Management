<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Doctor</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>
                <i class="bi bi-pencil-square"></i>
                Edit Doctor
            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/doctors/update}"
                  th:object="${doctor}"
                  method="post">

                <!-- Hidden ID -->
                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">First Name</label>

                        <input
                                type="text"
                                th:field="*{firstName}"
                                class="form-control"
                                required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Last Name</label>

                        <input
                                type="text"
                                th:field="*{lastName}"
                                class="form-control"
                                required>

                    </div>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                            type="email"
                            th:field="*{email}"
                            class="form-control">

                </div>

                <div class="mb-3">

                    <label>Phone Number</label>

                    <input
                            type="text"
                            th:field="*{phoneNumber}"
                            class="form-control">

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Department</label>

                        <input
                                type="text"
                                th:field="*{department}"
                                class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Specialization</label>

                        <input
                                type="text"
                                th:field="*{specialization}"
                                class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Qualification</label>

                        <input
                                type="text"
                                th:field="*{qualification}"
                                class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Experience</label>

                        <input
                                type="number"
                                th:field="*{experience}"
                                class="form-control">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>Consultation Fee</label>

                        <input
                                type="number"
                                step="0.01"
                                th:field="*{consultationFee}"
                                class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Status</label>

                        <select
                                th:field="*{status}"
                                class="form-select">

                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>

                        </select>

                    </div>

                </div>

                <div class="mb-3">

                    <label>License Number</label>

                    <input
                            type="text"
                            th:field="*{licenseNumber}"
                            class="form-control">

                </div>

                <div class="text-center">

                    <button
                            class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Update Doctor

                    </button>

                    <a
                            th:href="@{/doctors}"
                            class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
