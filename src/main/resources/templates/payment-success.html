<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Payment Success</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<style>

.success-card{

    border-radius:15px;

}


.success-icon{

    font-size:70px;
    color:green;

}

</style>


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow success-card">



<div class="card-body text-center">





<i class="bi bi-check-circle-fill success-icon"></i>





<h2 class="text-success mt-3">

Payment Successful

</h2>





<p class="lead">

Your payment has been completed successfully.

</p>









<div class="card mt-4">



<div class="card-body">





<table class="table table-bordered">



<tr>

<th>Transaction ID</th>

<td th:text="${payment.transactionId}"></td>

</tr>




<tr>

<th>Bill ID</th>

<td th:text="${payment.billId}"></td>

</tr>




<tr>

<th>Amount Paid</th>

<td>

₹ <span th:text="${payment.amount}"></span>

</td>

</tr>




<tr>

<th>Payment Method</th>

<td th:text="${payment.paymentMethod}"></td>

</tr>




<tr>

<th>Status</th>

<td>


<span class="badge bg-success"
th:text="${payment.paymentStatus}">

SUCCESS

</span>


</td>

</tr>




<tr>

<th>Date</th>

<td th:text="${payment.paymentDate}"></td>

</tr>



</table>





</div>


</div>








<button onclick="window.print()"
class="btn btn-primary mt-3">


<i class="bi bi-printer"></i>

Print Receipt


</button>








<a th:href="@{/patient/billing}"
class="btn btn-secondary mt-3">


<i class="bi bi-receipt"></i>

View Bills


</a>








<a th:href="@{/patient/dashboard}"
class="btn btn-outline-primary mt-3">


<i class="bi bi-house"></i>

Dashboard


</a>





</div>


</div>






</div>



</body>


</html>
