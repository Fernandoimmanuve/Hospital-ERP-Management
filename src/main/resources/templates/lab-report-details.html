<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Lab Report Details</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<style>

.report-card{

    border-radius:15px;

}


.section-header{

    background:#dc3545;
    color:white;
    padding:10px;
    border-radius:5px;

}

</style>


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow report-card">



<div class="card-header bg-danger text-white">


<div class="d-flex justify-content-between align-items-center">


<h3>

🧪 Laboratory Report Details

</h3>




<button onclick="window.print()"
class="btn btn-light">


<i class="bi bi-printer"></i>

Print Report


</button>



</div>


</div>









<div class="card-body">









<h5 class="section-header">

👤 Patient Information

</h5>





<table class="table table-bordered">


<tr>

<th>Patient Name</th>

<td th:text="${report.patientName}"></td>

</tr>



<tr>

<th>Patient ID</th>

<td th:text="${report.patientId}"></td>

</tr>


</table>









<h5 class="section-header mt-4">

🧪 Test Information

</h5>





<table class="table table-bordered">


<tr>

<th>Test Name</th>

<td th:text="${report.testName}"></td>

</tr>



<tr>

<th>Sample Code</th>

<td th:text="${report.sampleCode}"></td>

</tr>



<tr>

<th>Report Date</th>

<td th:text="${report.resultDate}"></td>

</tr>



<tr>

<th>Laboratory Status</th>

<td th:text="${report.status}"></td>

</tr>


</table>









<h5 class="section-header mt-4">

📊 Test Result

</h5>





<div class="alert alert-info">


<h5>

Result Value:

</h5>


<p th:text="${report.resultValue}">

Result

</p>


</div>









<table class="table table-bordered">


<tr>

<th>Normal Range</th>

<td th:text="${report.normalRange}"></td>

</tr>



<tr>

<th>Unit</th>

<td th:text="${report.resultUnit}"></td>

</tr>



<tr>

<th>Verification Status</th>

<td th:text="${report.verificationStatus}"></td>

</tr>


</table>









<h5 class="section-header mt-4">

🩺 Doctor Remarks

</h5>





<div class="alert alert-warning">


<p th:text="${report.remarks}">

Doctor Comments

</p>


</div>









<a th:href="@{/patient/lab-reports}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Back


</a>





</div>


</div>




</div>



</body>


</html>
