<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>


<meta charset="UTF-8">


<title>Stock Dashboard | Hospital ERP</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


<style>


.card-box{

    border-radius:15px;
    transition:.3s;

}


.card-box:hover{

    transform:translateY(-5px);

}


.icon{

    font-size:40px;

}


</style>



</head>




<body class="bg-light">



<div class="container-fluid mt-4">



<div class="card shadow mb-4">


<div class="card-header bg-dark text-white">


<h2>

<i class="bi bi-box-seam"></i>

Medicine Stock Dashboard

</h2>


</div>


</div>






<div class="row g-4">





<div class="col-md-4">


<div class="card shadow card-box text-center">


<div class="card-body">


<i class="bi bi-list-check icon text-primary"></i>


<h5>Total Transactions</h5>


<h2 th:text="${totalTransactions}">
0
</h2>


</div>


</div>


</div>







<div class="col-md-4">


<div class="card shadow card-box text-center">


<div class="card-body">


<i class="bi bi-arrow-up-circle icon text-danger"></i>


<h5>Medicine Issued</h5>


<h2 th:text="${issueCount}">
0
</h2>


</div>


</div>


</div>







<div class="col-md-4">


<div class="card shadow card-box text-center">


<div class="card-body">


<i class="bi bi-plus-circle icon text-success"></i>


<h5>Medicine Restocked</h5>


<h2 th:text="${restockCount}">
0
</h2>


</div>


</div>


</div>





</div>







<div class="mt-5">


<a th:href="@{/admin/pharmacy/stock}"
class="btn btn-primary">


<i class="bi bi-clock-history"></i>

View Stock History


</a>



<a th:href="@{/admin/pharmacy}"
class="btn btn-secondary">


<i class="bi bi-capsule"></i>

Pharmacy


</a>



</div>






</div>



</body>


</html>
