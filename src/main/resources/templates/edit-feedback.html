<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Edit Feedback</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow">



<div class="card-header bg-success text-white">


<h3>

✏️ Edit Feedback

</h3>


</div>







<div class="card-body">





<form th:action="@{/patient/feedback/update}"
th:object="${feedback}"
method="post">





<input type="hidden"
th:field="*{id}">






<div class="mb-3">


<label class="form-label">

Doctor Name

</label>


<input type="text"
class="form-control"
th:field="*{doctorName}"
required>


</div>









<div class="mb-3">


<label class="form-label">

Service Type

</label>


<select class="form-select"
th:field="*{serviceType}">


<option value="CONSULTATION">

Doctor Consultation

</option>


<option value="LAB">

Laboratory Service

</option>


<option value="PHARMACY">

Pharmacy Service

</option>


<option value="HOSPITAL">

Hospital Service

</option>


</select>


</div>









<div class="mb-3">


<label class="form-label">

Rating ⭐

</label>



<select class="form-select"
th:field="*{rating}">


<option value="5">

⭐⭐⭐⭐⭐ Excellent

</option>


<option value="4">

⭐⭐⭐⭐ Very Good

</option>


<option value="3">

⭐⭐⭐ Good

</option>


<option value="2">

⭐⭐ Average

</option>


<option value="1">

⭐ Poor

</option>


</select>


</div>









<div class="mb-3">


<label class="form-label">

Comments

</label>



<textarea class="form-control"
rows="5"
th:field="*{comments}">

</textarea>



</div>









<button type="submit"
class="btn btn-success">


<i class="bi bi-save"></i>

Update Feedback


</button>








<a th:href="@{/patient/feedback}"
class="btn btn-secondary">


<i class="bi bi-x-circle"></i>

Cancel


</a>







</form>





</div>


</div>






</div>



</body>


</html>
