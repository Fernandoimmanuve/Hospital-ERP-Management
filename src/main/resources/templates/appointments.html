<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h3>
                    <i class="bi bi-calendar-check me-1"></i> My Appointments
                </h3>
                <a th:href="@{/doctor/dashboard}" class="btn btn-light">
                    <i class="bi bi-house"></i> Dashboard
                </a>
            </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(appointments)}" class="alert alert-info">
                No appointments available.
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Patient</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Reason</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appointment:${appointments}">
                            <td th:text="${appointment.id}"></td>
                            <td>
                                <i class="bi bi-person-circle"></i>
                                <span th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}">Patient</span>
                            </td>
                            <td th:text="${appointment.appointmentDate}"></td>
                            <td th:text="${appointment.appointmentTime}"></td>
                            <td th:text="${appointment.reason}"></td>
                            <td>
                                <span class="badge bg-warning" th:if="${appointment.status=='PENDING'}">PENDING</span>
                                <span class="badge bg-success" th:if="${appointment.status=='ACCEPTED'}">ACCEPTED</span>
                                <span class="badge bg-danger" th:if="${appointment.status=='REJECTED'}">REJECTED</span>
                                <span class="badge bg-primary" th:if="${appointment.status=='COMPLETED'}">COMPLETED</span>
                            </td>
                            <td>
                                <a th:href="@{/doctor/appointments/view/{id}(id=${appointment.id})}" class="btn btn-info btn-sm">
                                    <i class="bi bi-eye"></i> View
                                </a>
                                <a th:href="@{/doctor/appointments/accept/{id}(id=${appointment.id})}" class="btn btn-success btn-sm">
                                    <i class="bi bi-check-circle"></i> Accept
                                </a>
                                <a th:href="@{/doctor/appointments/reject/{id}(id=${appointment.id})}" class="btn btn-danger btn-sm">
                                    <i class="bi bi-x-circle"></i> Reject
                                </a>
                                <a th:href="@{/doctor/appointments/complete/{id}(id=${appointment.id})}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-check2-all"></i> Complete
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
