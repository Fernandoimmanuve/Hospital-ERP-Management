<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment | Hospital ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>
                <i class="bi bi-pencil-square"></i>
                Edit Appointment
            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/admin/appointments/update}"
                  th:object="${appointment}"
                  method="post">

                <!-- Appointment ID -->
                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <!-- Patient -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Patient</label>

                        <select class="form-select"
                                th:field="*{patient}"
                                required>

                            <option th:each="patient : ${patients}"
                                    th:value="${patient.id}"
                                    th:text="${patient.patientName}">
                            </option>

                        </select>

                    </div>

                    <!-- Doctor -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Doctor</label>

                        <select class="form-select"
                                th:field="*{doctor}"
                                required>

                            <option th:each="doctor : ${doctors}"
                                    th:value="${doctor.id}"
                                    th:text="${doctor.doctorName}">
                            </option>

                        </select>

                    </div>

                    <!-- Department -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Department</label>

                        <select class="form-select"
                                th:field="*{department}"
                                required>

                            <option th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.departmentName}">
                            </option>

                        </select>

                    </div>

                    <!-- Appointment Date -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">Appointment Date</label>

                        <input type="date"
                               class="form-control"
                               th:field="*{appointmentDate}"
                               required>

                    </div>

                    <!-- Appointment Time -->
                    <div class="col-md-3 mb-3">

                        <label class="form-label">Appointment Time</label>

                        <input type="time"
                               class="form-control"
                               th:field="*{appointmentTime}"
                               required>

                    </div>

                    <!-- Status -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">Status</label>

                        <select class="form-select"
                                th:field="*{status}">

                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>

                        </select>

                    </div>

                    <!-- Reason -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">Reason for Visit</label>

                        <textarea class="form-control"
                                  rows="4"
                                  th:field="*{reason}"
                                  required>
                        </textarea>

                    </div>

                </div>

                <button type="submit" class="btn btn-success">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Appointment

                </button>

                <a th:href="@{/admin/appointments}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left-circle"></i>

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
