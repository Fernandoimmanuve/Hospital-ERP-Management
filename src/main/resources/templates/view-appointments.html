<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Doctor Appointments</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>



<body class="bg-light">



<div class="container-fluid mt-4">



<div class="card shadow">



<div class="card-header bg-success text-white">


<div class="d-flex justify-content-between align-items-center">


<h3>

📅 Doctor Appointment Schedule

</h3>




<a th:href="@{/doctor/dashboard}"
class="btn btn-light">


<i class="bi bi-speedometer2"></i>

Dashboard


</a>


</div>







<div class="card-body">



<div class="mb-3">


<a th:href="@{/doctor/appointments/today}"
class="btn btn-primary">


<i class="bi bi-calendar-day"></i>

Today's Appointments


</a>


</div>





<table class="table table-bordered table-hover">



<thead class="table-dark">


<tr>


<th>ID</th>

<th>Patient Name</th>

<th>Phone</th>

<th>Date</th>

<th>Time</th>

<th>Reason</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>







<tbody>



<tr th:each="appointment:${appointments}">



<td th:text="${appointment.id}">
</td>




<td th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}">
</td>




<td th:text="${appointment.patient.phoneNumber}">
</td>




<td th:text="${appointment.appointmentDate}">
</td>




<td th:text="${appointment.appointmentTime}">
</td>




<td th:text="${appointment.reason}">
</td>







<td>


<span class="badge bg-warning text-dark"
th:if="${appointment.status=='Pending'}">

Pending

</span>




<span class="badge bg-success"
th:if="${appointment.status=='Confirmed'}">

Confirmed

</span>




<span class="badge bg-primary"
th:if="${appointment.status=='Completed'}">

Completed

</span>




<span class="badge bg-danger"
th:if="${appointment.status=='Cancelled'}">

Cancelled

</span>



</td>







<td>



<a th:href="@{/doctor/appointments/accept/{id}(id=${appointment.id})}"
class="btn btn-success btn-sm"
th:if="${appointment.status=='Pending'}">


<i class="bi bi-check-circle"></i>

Accept


</a>





<a th:href="@{/doctor/appointments/complete/{id}(id=${appointment.id})}"
class="btn btn-primary btn-sm"
th:if="${appointment.status=='Confirmed'}">


<i class="bi bi-check2-all"></i>

Complete


</a>





<a th:href="@{/doctor/appointments/cancel/{id}(id=${appointment.id})}"
class="btn btn-danger btn-sm"
onclick="return confirm('Cancel appointment?')">


<i class="bi bi-x-circle"></i>

Cancel


</a>





<a th:href="@{/doctor/appointments/patient/{id}(id=${appointment.patient.id})}"
class="btn btn-info btn-sm text-white">


<i class="bi bi-person"></i>

Patient


</a>



</td>



</tr>


</tbody>



</table>



</div>


</div>



</body>


</html>
