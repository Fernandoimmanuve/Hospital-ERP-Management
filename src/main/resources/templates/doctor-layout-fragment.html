<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, cssLinks)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Dreams EMR - Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.min.css" rel="stylesheet">
    <link th:href="@{/dashboard.css}" rel="stylesheet">
    <th:block th:replace="${cssLinks}"></th:block>
</head>

<body th:fragment="body(content)">

    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="mainSidebar">
        <!-- Logo -->
        <div class="sidebar-logo-area">
            <div class="sidebar-logo-icon">
                <i class="fas fa-user-md"></i>
            </div>
            <div class="sidebar-logo-text">
                Dreams EMR
                <span>Doctor Portal</span>
            </div>
        </div>

        <!-- Navigation -->
        <div class="sidebar-scroll" id="sidebarNav">
            <div class="sidebar-section-title">Main Menu</div>

            <a href="/doctor/dashboard" class="sidebar-item active">
                <i class="fas fa-th-large"></i>
                <span class="label">Dashboard</span>
            </a>

            <div class="sidebar-section-title">DOCTOR</div>

            <a href="/doctor/profile" class="sidebar-item">
                <i class="fas fa-user-circle"></i>
                <span class="label">My Profile</span>
            </a>
            <a href="/doctor/appointments" class="sidebar-item">
                <i class="fas fa-calendar-check"></i>
                <span class="label">Appointments</span>
            </a>
            <a href="/doctor/patients" class="sidebar-item">
                <i class="fas fa-users"></i>
                <span class="label">Patients</span>
            </a>
            <a href="/doctor/prescription/history" class="sidebar-item">
                <i class="fas fa-prescription"></i>
                <span class="label">Prescriptions</span>
            </a>
            <a href="/doctor/lab-reports" class="sidebar-item">
                <i class="fas fa-flask"></i>
                <span class="label">Lab Reports</span>
            </a>

            <div class="sidebar-section-title">QUICK LINKS</div>

            <a href="/doctor/appointments" class="sidebar-item">
                <i class="fas fa-calendar-plus"></i>
                <span class="label">View Appointments</span>
            </a>
            <a href="/doctor/patients" class="sidebar-item">
                <i class="fas fa-user-injured"></i>
                <span class="label">Patient Records</span>
            </a>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
            <a href="/doctor/profile" class="sidebar-item">
                <i class="fas fa-user-circle"></i>
                <span class="label">My Profile</span>
            </a>
            <a href="/logout" class="sidebar-item" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span class="label">Logout</span>
            </a>
        </div>
    </aside>

    <!-- ===================== NAVBAR ===================== -->
    <header class="navbar-premium" id="mainNavbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <button class="toggle-sidebar" id="mobileSidebarToggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="navbar-page-title">Dashboard</h5>
            </div>
            <div class="navbar-right">
                <!-- Search -->
                <div class="search-box d-none d-md-block">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Search patients..." aria-label="Search">
                </div>

                <!-- Fullscreen -->
                <button class="nav-icon-btn" id="fullscreenBtn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>

                <!-- Notifications -->
                <button class="nav-icon-btn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge-count">3</span>
                </button>

                <!-- Profile -->
                <div class="profile-area dropdown">
                    <img class="profile-avatar" src="https://ui-avatars.com/api/?name=Doctor&background=10B981&color=fff&size=34" alt="Doctor">
                    <div>
                        <div class="profile-name" th:text="${doctorName}">Doctor</div>
                        <div class="profile-role">Physician</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main-content" id="mainContent">
        <th:block th:replace="${content}"></th:block>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:src="@{/dashboard.js}"></script>
</body>
</html>
