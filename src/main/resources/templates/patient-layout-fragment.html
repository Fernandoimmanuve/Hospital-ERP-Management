<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, cssLinks)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Dreams EMR - Patient Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.min.css" rel="stylesheet">
    <link th:href="@{/dashboard.css}" rel="stylesheet">
    <th:block th:replace="${cssLinks}"></th:block>
</head>

<body th:fragment="body(content)">

    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="mainSidebar">
        <!-- Logo -->
        <div class="sidebar-logo-area">
            <div class="sidebar-logo-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="sidebar-logo-text">
                Dreams EMR
                <span>Patient Portal</span>
            </div>
        </div>

        <!-- Navigation -->
        <div class="sidebar-scroll" id="sidebarNav">
            <div class="sidebar-section-title">Main Menu</div>

            <a href="/patient/dashboard" class="sidebar-item active">
                <i class="fas fa-th-large"></i>
                <span class="label">Dashboard</span>
            </a>

            <div class="sidebar-section-title">MY HEALTH</div>

            <a href="/patient/appointments" class="sidebar-item">
                <i class="fas fa-calendar-check"></i>
                <span class="label">My Appointments</span>
            </a>
            <a href="/patient/appointments/book" class="sidebar-item">
                <i class="fas fa-calendar-plus"></i>
                <span class="label">Book Appointment</span>
            </a>
            <a href="/patient/history" class="sidebar-item">
                <i class="fas fa-notes-medical"></i>
                <span class="label">Medical History</span>
            </a>

            <div class="sidebar-section-title">BILLING & LAB</div>

            <a href="/patient/billing" class="sidebar-item">
                <i class="fas fa-file-invoice-dollar"></i>
                <span class="label">Billing</span>
            </a>
            <a href="/patient/lab-reports" class="sidebar-item">
                <i class="fas fa-flask"></i>
                <span class="label">Lab Reports</span>
            </a>

            <div class="sidebar-section-title">ENGAGEMENT</div>

            <a href="/patient/feedback/add" class="sidebar-item">
                <i class="fas fa-comment-medical"></i>
                <span class="label">Give Feedback</span>
            </a>
            <a href="/patient/feedback" class="sidebar-item">
                <i class="fas fa-star"></i>
                <span class="label">My Feedback</span>
            </a>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
            <a href="/logout" class="sidebar-item" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                <span class="label">Logout</span>
            </a>
        </div>
    </aside>

    <!-- ===================== NAVBAR ===================== -->
    <header class="navbar-premium" id="mainNavbar">
        <div class="navbar-inner">
            <div class="navbar-left">
                <button class="toggle-sidebar" id="mobileSidebarToggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="navbar-page-title">Patient Dashboard</h5>
            </div>
            <div class="navbar-right">
                <!-- Fullscreen -->
                <button class="nav-icon-btn" id="fullscreenBtn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>

                <!-- Notifications -->
                <button class="nav-icon-btn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge-count">2</span>
                </button>

                <!-- Profile -->
                <div class="profile-area dropdown">
                    <img class="profile-avatar" src="https://ui-avatars.com/api/?name=Patient&background=7C3AED&color=fff&size=34" alt="Patient">
                    <div>
                        <div class="profile-name" th:text="${patientName}">Patient</div>
                        <div class="profile-role">Patient</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="main-content" id="mainContent">
        <th:block th:replace="${content}"></th:block>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:src="@{/dashboard.js}"></script>
</body>
</html>
