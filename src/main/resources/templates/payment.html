<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Payment</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>




<body class="bg-light">



<div class="container mt-5">





<div class="card shadow">



<div class="card-header bg-success text-white">


<h3>

💳 Complete Payment

</h3>


</div>







<div class="card-body">







<h5 class="bg-primary text-white p-2 rounded">

🧾 Bill Summary

</h5>







<table class="table table-bordered">


<tr>

<th>Bill Number</th>

<td th:text="${bill.billNumber}"></td>

</tr>



<tr>

<th>Service</th>

<td th:text="${bill.serviceType}"></td>

</tr>



<tr>

<th>Description</th>

<td th:text="${bill.description}"></td>

</tr>



<tr>

<th>Total Amount</th>

<td>

₹ <span th:text="${bill.amount}"></span>

</td>

</tr>


</table>









<h5 class="bg-success text-white p-2 rounded mt-4">

💰 Select Payment Method

</h5>








<form th:action="@{/patient/payment/process}"
method="post">





<input type="hidden"
name="billId"
th:value="${bill.id}">







<div class="form-check mb-3">


<input class="form-check-input"
type="radio"
name="paymentMethod"
value="UPI"
checked>


<label class="form-check-label">

<i class="bi bi-phone"></i>

UPI Payment

</label>


</div>








<div class="form-check mb-3">


<input class="form-check-input"
type="radio"
name="paymentMethod"
value="CARD">


<label class="form-check-label">

<i class="bi bi-credit-card"></i>

Debit / Credit Card

</label>


</div>








<div class="form-check mb-3">


<input class="form-check-input"
type="radio"
name="paymentMethod"
value="NET_BANKING">


<label class="form-check-label">

<i class="bi bi-bank"></i>

Net Banking

</label>


</div>









<button type="submit"
class="btn btn-success">


<i class="bi bi-check-circle"></i>

Confirm Payment


</button>









<a th:href="@{/patient/billing}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Cancel


</a>






</form>





</div>


</div>






</div>



</body>


</html>
