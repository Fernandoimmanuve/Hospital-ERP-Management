<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Patients List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

            <h3>
                <i class="bi bi-people-fill"></i>
                Patient Management
            </h3>

            <a th:href="@{/patients/add}" class="btn btn-light">
                <i class="bi bi-plus-circle-fill"></i>
                Add Patient
            </a>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Blood Group</th>
                        <th>Status</th>
                        <th width="200">Action</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="patient : ${patients}">

                        <td th:text="${patient.id}"></td>
                        <td th:text="${patient.firstName}"></td>
                        <td th:text="${patient.lastName}"></td>
                        <td th:text="${patient.email}"></td>
                        <td th:text="${patient.phoneNumber}"></td>
                        <td th:text="${patient.bloodGroup}"></td>
                        <td>
                            <span class="badge bg-success" th:if="${patient.status == 'ACTIVE'}" th:text="${patient.status}">ACTIVE</span>
                            <span class="badge bg-danger" th:if="${patient.status != 'ACTIVE'}" th:text="${patient.status}">INACTIVE</span>
                        </td>
                        <td>
                            <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="btn btn-info btn-sm">
                                <i class="bi bi-eye-fill"></i>
                            </a>
                            <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <a th:href="@{/patients/delete/{id}(id=${patient.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Delete this patient?')">
                                <i class="bi bi-trash-fill"></i>
                            </a>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="8" class="text-center text-muted">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            No patients found.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

            <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i>
                Back to Dashboard
            </a>

        </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
