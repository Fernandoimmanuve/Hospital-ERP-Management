<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<title>Lab Request Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>



<body class="bg-light">


<div class="container mt-5">


<h2>
🧪 Laboratory Request Dashboard
</h2>



<div class="row mt-4">



<div class="col-md-4">

<div class="card shadow text-center p-4">

<h5>Total Requests</h5>

<h1 th:text="${totalRequests}">
0
</h1>


</div>

</div>






<div class="col-md-4">

<div class="card shadow text-center p-4">


<h5>Pending</h5>


<h1 th:text="${pendingRequests}">
0
</h1>


</div>

</div>






<div class="col-md-4">

<div class="card shadow text-center p-4">


<h5>Completed</h5>


<h1 th:text="${completedRequests}">
0
</h1>


</div>

</div>




</div>



</div>


</body>


</html>
