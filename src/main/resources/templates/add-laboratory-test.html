<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<title>Add Laboratory Test</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


</head>



<body class="bg-light">



<div class="container mt-5">


<div class="card shadow">


<div class="card-header bg-success text-white">

<h3>
Add Laboratory Test
</h3>

</div>





<div class="card-body">



<form th:action="@{/admin/laboratory-tests/save}"
th:object="${laboratoryTest}"
method="post">



<div class="mb-3">

<label>Test Name</label>

<input type="text"
class="form-control"
th:field="*{testName}"
required>

</div>




<div class="mb-3">

<label>Category</label>

<input type="text"
class="form-control"
th:field="*{category}">

</div>





<div class="mb-3">

<label>Description</label>

<textarea class="form-control"
th:field="*{description}">
</textarea>

</div>





<div class="mb-3">

<label>Price</label>

<input type="number"
class="form-control"
th:field="*{price}">

</div>





<div class="mb-3">

<label>Normal Range</label>

<input type="text"
class="form-control"
th:field="*{normalRange}">

</div>





<div class="mb-3">

<label>Status</label>


<select class="form-control"
th:field="*{status}">


<option value="Active">
Active
</option>


<option value="Inactive">
Inactive
</option>


</select>


</div>





<button class="btn btn-success">

Save Test

</button>


<a th:href="@{/admin/laboratory-tests}">
class="btn btn-secondary">

Cancel

</a>



</form>



</div>


</div>


</div>


</body>


</html>
