<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prescription Management | Hospital ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <div class="card shadow">

        <!-- Header -->

        <div class="card-header bg-success text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3>

                    <i class="bi bi-file-earmark-medical-fill"></i>

                    Prescription Management

                </h3>

                <a th:href="@{/admin/prescriptions/add}"
                   class="btn btn-light">

                    <i class="bi bi-plus-circle-fill"></i>

                    Add Prescription

                </a>

            </div>

        </div>

        <!-- Body -->

        <div class="card-body">

            <!-- Search -->

            <form th:action="@{/admin/prescriptions/search}"
                  method="get"
                  class="row mb-4">

                <div class="col-md-10">

                    <input
                            type="text"
                            name="keyword"
                            class="form-control"
                            placeholder="Search by Patient Name">

                </div>

                <div class="col-md-2">

                    <button class="btn btn-success w-100">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </form>

            <!-- Table -->

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Patient</th>

                        <th>Doctor</th>

                        <th>Appointment</th>

                        <th>Date</th>

                        <th>Diagnosis</th>

                        <th>Medicine</th>

                        <th>Dosage</th>

                        <th>Frequency</th>

                        <th>Duration</th>

                        <th width="180">Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="prescription : ${prescriptions}">

                        <td th:text="${prescription.id}"></td>

                        <td th:text="${prescription.patient.patientName}"></td>

                        <td th:text="${prescription.doctor.doctorName}"></td>

                        <td th:text="${prescription.appointment.id}"></td>

                        <td th:text="${prescription.prescriptionDate}"></td>

                        <td th:text="${prescription.diagnosis}"></td>

                        <td th:text="${prescription.medicine}"></td>

                        <td th:text="${prescription.dosage}"></td>

                        <td th:text="${prescription.frequency}"></td>

                        <td th:text="${prescription.duration}"></td>

                        <td>

                            <a
                               th:href="@{/admin/prescriptions/edit/{id}(id=${prescription.id})}"
                               class="btn btn-warning btn-sm">

                                <i class="bi bi-pencil-square"></i>

                                Edit

                            </a>

                            <a
                               th:href="@{/admin/prescriptions/delete/{id}(id=${prescription.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this prescription?');">

                                <i class="bi bi-trash-fill"></i>

                                Delete

                            </a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(prescriptions)}">

                        <td colspan="11"
                            class="text-center text-muted">

                            No Prescriptions Found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <!-- Footer -->

            <div class="mt-3">

                <a th:href="@{/admin/dashboard}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left-circle"></i>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
