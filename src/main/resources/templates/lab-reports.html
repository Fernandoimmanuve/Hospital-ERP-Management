<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>My Lab Reports</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>



<body class="bg-light">



<div class="container-fluid mt-4">





<div class="card shadow">



<div class="card-header bg-danger text-white">


<div class="d-flex justify-content-between align-items-center">


<h3>

🧪 My Laboratory Reports

</h3>




<a th:href="@{/patient/dashboard}"
class="btn btn-light">


<i class="bi bi-speedometer2"></i>

Dashboard


</a>


</div>


</div>









<div class="card-body">





<table class="table table-bordered table-hover">



<thead class="table-dark">


<tr>


<th>ID</th>

<th>Test Name</th>

<th>Sample Code</th>

<th>Result</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>









<tbody>



<tr th:each="report:${reports}">





<td th:text="${report.id}">
</td>






<td th:text="${report.testName}">
</td>







<td th:text="${report.sampleCode}">
</td>







<td th:text="${report.resultValue}">
</td>







<td th:text="${report.resultDate}">
</td>









<td>



<span class="badge bg-warning text-dark"
th:if="${report.verificationStatus=='Pending'}">


Pending


</span>





<span class="badge bg-success"
th:if="${report.verificationStatus=='Approved'}">


Approved


</span>





<span class="badge bg-danger"
th:if="${report.verificationStatus=='Rejected'}">


Rejected


</span>



</td>









<td>


<a th:href="@{/patient/lab-reports/view/{id}(id=${report.id})}"
class="btn btn-primary btn-sm">


<i class="bi bi-eye"></i>

View


</a>


</td>






</tr>



</tbody>



</table>







<a th:href="@{/patient/dashboard}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Back


</a>





</div>


</div>






</div>



</body>


</html>
