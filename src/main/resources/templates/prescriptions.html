<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prescriptions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <div class="d-flex justify-content-between align-items-center">
                <h3>
                    <i class="bi bi-prescription2 me-1"></i> My Prescriptions
                </h3>
                <a th:href="@{/patient/dashboard}" class="btn btn-light">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </div>

        <div class="card-body">

            <div th:if="${#lists.isEmpty(prescriptions)}" class="alert alert-info">
                No prescriptions available.
            </div>

            <div th:if="${not #lists.isEmpty(prescriptions)}">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Doctor</th>
                            <th>Medicines</th>
                            <th>Dosage</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prescription:${prescriptions}">
                            <td th:text="${prescription.id}"></td>
                            <td th:text="${prescription.doctor.firstName + ' ' + prescription.doctor.lastName}"></td>
                            <td th:text="${prescription.medicines}"></td>
                            <td th:text="${prescription.dosage}"></td>
                            <td th:text="${prescription.prescriptionDate}"></td>
                            <td>
                                <span class="badge bg-warning text-dark" th:if="${prescription.status=='Pending'}">Pending</span>
                                <span class="badge bg-success" th:if="${prescription.status=='Approved'}">Approved</span>
                                <span class="badge bg-danger" th:if="${prescription.status=='Rejected'}">Rejected</span>
                                <span class="badge bg-primary" th:if="${prescription.status == null or prescription.status == 'ACTIVE'}">ACTIVE</span>
                            </td>
                            <td>
                                <a th:href="@{/patient/prescriptions/view/{id}(id=${prescription.id})}" class="btn btn-primary btn-sm">
                                    <i class="bi bi-eye"></i> View
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <a th:href="@{/patient/dashboard}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>

        </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
