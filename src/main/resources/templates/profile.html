<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .profile-card { border-radius: 15px; }
        .profile-header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
        }
        .info-title { color: #0d6efd; font-weight: bold; }
    </style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow profile-card">

        <div class="profile-header text-center">
            <i class="bi bi-person-circle" style="font-size:70px;"></i>
            <h2 class="mt-2">
                <span th:text="${doctor.firstName + ' ' + doctor.lastName}">Doctor Name</span>
            </h2>
            <p>
                <i class="bi bi-heart-pulse me-1"></i>
                <span th:text="${doctor.specialization}">Specialization</span>
            </p>
        </div>

        <div class="card-body">

            <h5 class="info-title">Professional Information</h5>

            <table class="table table-bordered">
                <tr>
                    <th>Department</th>
                    <td th:text="${doctor.department}"></td>
                </tr>
                <tr>
                    <th>Specialization</th>
                    <td th:text="${doctor.specialization}"></td>
                </tr>
                <tr>
                    <th>Qualification</th>
                    <td th:text="${doctor.qualification}"></td>
                </tr>
                <tr>
                    <th>Experience</th>
                    <td><span th:text="${doctor.experience}"></span> Years</td>
                </tr>
                <tr>
                    <th>License Number</th>
                    <td th:text="${doctor.licenseNumber}"></td>
                </tr>
                <tr>
                    <th>Consultation Fee</th>
                    <td th:text="${doctor.consultationFee}"></td>
                </tr>
            </table>

            <h5 class="info-title mt-4">Contact Information</h5>

            <table class="table table-bordered">
                <tr>
                    <th>Email</th>
                    <td th:text="${doctor.email}"></td>
                </tr>
                <tr>
                    <th>Phone</th>
                    <td th:text="${doctor.phoneNumber}"></td>
                </tr>
                <tr>
                    <th>Gender</th>
                    <td th:text="${doctor.gender}"></td>
                </tr>
                <tr>
                    <th>Date of Birth</th>
                    <td th:text="${doctor.dateOfBirth}"></td>
                </tr>
            </table>

            <div class="mt-4">
                <a th:href="@{/doctor/profile/edit}" class="btn btn-primary">
                    <i class="bi bi-pencil"></i> Edit Profile
                </a>
                <a th:href="@{/doctor/dashboard}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
            </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
