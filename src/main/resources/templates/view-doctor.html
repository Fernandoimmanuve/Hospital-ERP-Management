<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Doctor Profile</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3>
                <i class="bi bi-person-badge-fill"></i>
                Doctor Profile
            </h3>

        </div>

        <div class="card-body">

            <div class="row">

                <!-- Profile Photo -->

                <div class="col-md-4 text-center">

                    <img src="https://via.placeholder.com/200"
                         class="rounded-circle img-thumbnail mb-3"
                         width="180"
                         height="180">

                    <h4>
                        <span th:text="${doctor.firstName}"></span>
                        <span th:text="${doctor.lastName}"></span>
                    </h4>

                    <span
                        th:if="${doctor.status=='ACTIVE'}"
                        class="badge bg-success fs-6">

                        ACTIVE

                    </span>

                    <span
                        th:if="${doctor.status!='ACTIVE'}"
                        class="badge bg-danger fs-6">

                        INACTIVE

                    </span>

                </div>

                <!-- Doctor Details -->

                <div class="col-md-8">

                    <table class="table table-bordered">

                        <tr>
                            <th width="35%">Doctor ID</th>
                            <td th:text="${doctor.id}"></td>
                        </tr>

                        <tr>
                            <th>Email</th>
                            <td th:text="${doctor.email}"></td>
                        </tr>

                        <tr>
                            <th>Phone Number</th>
                            <td th:text="${doctor.phoneNumber}"></td>
                        </tr>

                        <tr>
                            <th>Gender</th>
                            <td th:text="${doctor.gender}"></td>
                        </tr>

                        <tr>
                            <th>Date of Birth</th>
                            <td th:text="${doctor.dateOfBirth}"></td>
                        </tr>

                        <tr>
                            <th>Department</th>
                            <td th:text="${doctor.department}"></td>
                        </tr>

                        <tr>
                            <th>Specialization</th>
                            <td th:text="${doctor.specialization}"></td>
                        </tr>

                        <tr>
                            <th>Qualification</th>
                            <td th:text="${doctor.qualification}"></td>
                        </tr>

                        <tr>
                            <th>Experience</th>
                            <td>
                                <span th:text="${doctor.experience}"></span> Years
                            </td>
                        </tr>

                        <tr>
                            <th>Consultation Fee</th>
                            <td>
                                ₹ <span th:text="${doctor.consultationFee}"></span>
                            </td>
                        </tr>

                        <tr>
                            <th>License Number</th>
                            <td th:text="${doctor.licenseNumber}"></td>
                        </tr>

                    </table>

                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}"
                       class="btn btn-warning">

                        <i class="bi bi-pencil-fill"></i>
                        Edit

                    </a>

                    <a th:href="@{/doctors}"
                       class="btn btn-secondary">

                        <i class="bi bi-arrow-left"></i>
                        Back

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
