<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>My Bills</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">


</head>




<body class="bg-light">



<div class="container-fluid mt-4">





<div class="card shadow">



<div class="card-header bg-success text-white">


<div class="d-flex justify-content-between align-items-center">


<h3>

💳 My Billing History

</h3>



<a th:href="@{/patient/dashboard}"
class="btn btn-light">


<i class="bi bi-speedometer2"></i>

Dashboard


</a>


</div>


</div>









<div class="card-body">






<table class="table table-bordered table-hover">



<thead class="table-dark">


<tr>


<th>ID</th>

<th>Bill Number</th>

<th>Service Type</th>

<th>Description</th>

<th>Amount</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>









<tbody>



<tr th:each="bill:${bills}">





<td th:text="${bill.id}">
</td>







<td th:text="${bill.billNumber}">
</td>







<td th:text="${bill.serviceType}">
</td>







<td th:text="${bill.description}">
</td>







<td>

₹ <span th:text="${bill.amount}"></span>

</td>







<td th:text="${bill.billDate}">
</td>









<td>


<span class="badge bg-success"
th:if="${bill.paymentStatus=='PAID'}">


Paid


</span>





<span class="badge bg-warning text-dark"
th:if="${bill.paymentStatus=='PENDING'}">


Pending


</span>





<span class="badge bg-danger"
th:if="${bill.paymentStatus=='FAILED'}">


Failed


</span>



</td>









<td>




<a th:href="@{/patient/billing/view/{id}(id=${bill.id})}"
class="btn btn-primary btn-sm">


<i class="bi bi-eye"></i>

View


</a>








<a th:if="${bill.paymentStatus=='PENDING'}"
th:href="@{/patient/billing/pay/{id}(id=${bill.id})}"
class="btn btn-success btn-sm">


<i class="bi bi-credit-card"></i>

Pay


</a>





</td>







</tr>



</tbody>



</table>









<a th:href="@{/patient/dashboard}"
class="btn btn-secondary">


<i class="bi bi-arrow-left"></i>

Back


</a>





</div>


</div>






</div>



</body>


</html>
